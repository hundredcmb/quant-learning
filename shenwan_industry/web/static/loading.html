<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申万行业研究台</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --text: #1f2933;
      --muted: #6b7280;
      --primary: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #173a7a 0%, #2563eb 55%, #38bdf8 100%);
      color: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .loading-card {
      width: min(520px, 88vw);
      padding: 44px 40px 48px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 34px auto 22px;
      border: 4px solid rgba(255, 255, 255, 0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .status {
      font-size: 17px;
      font-weight: 600;
    }

    .hint {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="loading-card">
    <div class="brand">申万行业研究台</div>
    <div class="subtitle">数据源：Tushare</div>
    <div class="spinner"></div>
    <div class="status">正在启动服务...</div>
    <div class="hint">请稍候，首次启动可能需要一点时间</div>
  </main>
</body>
</html>
