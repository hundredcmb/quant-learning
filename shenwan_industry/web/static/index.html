<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申万行业研究台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-title">
      <h1>申万行业研究台</h1>
    </div>
    <button id="config-btn" class="header-btn">数据配置</button>
  </header>

  <main>
    <section class="controls">
      <div class="controls-left">
        <div class="control-row">
          <label class="radio">
            <input type="radio" name="mode" value="daily" checked>
            <span>单日排行</span>
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="range">
            <span>区间排行</span>
          </label>
        </div>

        <div class="control-row">
          <label class="field" id="daily-field">
            <span>日期</span>
            <input type="date" id="daily-date">
          </label>
          <label class="field range-field" id="range-start-field">
            <span>开始日期</span>
            <input type="date" id="range-start">
          </label>
          <label class="field range-field" id="range-end-field">
            <span>结束日期</span>
            <input type="date" id="range-end">
          </label>
          <button id="query-btn">开始查询</button>
        </div>
      </div>

      <div class="controls-right">
        <div class="control-row">
          <label class="field">
            <span>加权方式</span>
            <select id="weight">
              <option value="total">总市值加权</option>
              <option value="total_tr">总市值加权(全收益)</option>
              <option value="float">自由流通市值加权</option>
              <option value="float_tr" selected>自由流通市值加权(全收益)</option>
              <option value="equal">等权</option>
              <option value="equal_tr">等权(全收益)</option>
            </select>
          </label>
          <label class="field">
            <span>行业层级</span>
            <select id="level">
              <option value="1" selected>一级</option>
              <option value="2">二级</option>
              <option value="3">三级</option>
            </select>
          </label>
          <label class="field" id="profit-basis-field">
            <span>净利润口径</span>
            <select id="profit-basis">
              <option value="attr" selected>归母净利润</option>
              <option value="deduct">扣非净利润</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section id="progress-panel" class="progress-panel hidden">
      <div class="progress-meta">
        <span id="progress-phase">排队中</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress-message" class="progress-message"></div>
      <div class="progress-actions">
        <button id="cancel-btn" class="cancel-btn hidden">取消任务</button>
      </div>
    </section>

    <section id="error-panel" class="error-panel hidden"></section>

    <section id="result-panel" class="result-panel hidden">
      <div class="result-summary">
        <span id="summary-text"></span>
        <button id="result-back-btn" class="ghost-btn hidden">返回查询条件</button>
      </div>

      <div class="table-card">
        <div class="table-title">
          <h2 id="table-title">行业排行</h2>
          <span id="table-count"></span>
        </div>
        <table id="main-table">
          <thead>
            <tr>
              <th data-sort="rank">排名</th>
              <th data-sort="index_code">行业代码</th>
              <th data-sort="industry_name" id="main-name-header">行业名称</th>
              <th data-sort="pct" id="main-pct-header">涨幅</th>
              <th data-sort="pe">PE-TTM</th>
              <th data-sort="pb">PB</th>
              <th data-sort="count">成分股数量</th>
            </tr>
          </thead>
          <tbody id="main-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="sub-panel" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="sub-title">成分股</h2>
          <div id="sub-subtitle"></div>
        </div>
        <button id="sub-close" class="close-btn">关闭</button>
      </div>
      <div id="sub-loading" class="loading hidden">正在加载成分股...</div>
      <div id="sub-error" class="error-panel hidden"></div>
      <div class="sub-table-wrap">
        <table id="sub-table">
          <thead>
            <tr>
              <th data-sort="ts_code">代码</th>
              <th data-sort="name">名称</th>
              <th data-sort="pct_chg">涨跌幅</th>
              <th data-sort="close">收盘价</th>
              <th data-sort="amount">成交额</th>
              <th data-sort="total_mv">总市值</th>
              <th data-sort="free_mv">自由流通市值</th>
              <th data-sort="pe_ttm">PE-TTM</th>
              <th data-sort="pb">PB</th>
            </tr>
          </thead>
          <tbody id="sub-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="kline-panel" class="modal-mask hidden">
    <div class="modal kline-modal">
      <div class="modal-header">
        <div class="kline-title-wrap">
          <h2 id="kline-title">行业指数</h2>
          <div id="kline-subtitle"></div>
        </div>
        <button id="kline-close" class="close-btn">关闭</button>
      </div>
      <div class="kline-body">
        <div id="kline-loading" class="loading hidden">正在加载 K 线...</div>
        <div id="kline-error" class="error-panel hidden"></div>
        <div id="kline-chart" class="kline-chart"></div>
        <select id="kline-subchart">
          <option value="amount" selected>成交额</option>
          <option value="vol">成交量</option>
        </select>
      </div>
    </div>
  </div>

  <div id="config-panel" class="modal-mask hidden">
    <div class="modal config-modal">
      <div class="modal-header">
        <div>
          <h2>数据配置</h2>
        </div>
        <button id="config-close" class="close-btn">关闭</button>
      </div>
      <div class="config-body">
        <label class="field">
          <span>Tushare token</span>
          <input type="password" id="token-input" placeholder="填写你的 Tushare token">
        </label>
        <div class="config-actions">
          <button id="token-save-btn">保存</button>
          <button id="token-test-btn" class="ghost-btn">测试</button>
          <span id="token-status" class="token-status"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
